aid: thunkable
name: Thunkable
description: >-
  Thunkable is a no-code, AI-powered platform for building native iOS and
  Android mobile applications through a visual drag-and-drop designer, a
  block-based logic editor, and conversational AI prompts. Creators assemble
  screens and app logic without writing code, and connect their apps to
  external services using the built-in Web API blocks (HTTP GET/POST/PUT/DELETE
  against any REST endpoint), realtime databases, cloud storage, maps, media,
  push notifications, and payment providers such as Stripe. More than 5 million
  users across 185 countries have created over 11 million apps on the platform.
  Note that Thunkable itself does not publish a first-party developer REST API,
  OpenAPI specification, or SDK for programmatically managing Thunkable
  projects; its "API" surface is the in-app Web API component used to consume
  third-party APIs from within apps built on Thunkable.
